name: Update models
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch models
        run: |
          python3 - <<'PY'
          import json, urllib.request
          models = []
          # Ollama official
          try:
              with urllib.request.urlopen("https://ollama.com/api/tags") as r:
                  data = json.load(r)
              for m in data.get("models", []):
                  size = m.get("size") or 0
                  vram = round(size/1e9*1.05, 2)
                  if vram > 0.5:
                      models.append({"n": m["name"], "minVram": vram, "speed": 3})
          except Exception as e:
              print("ollama err", e)
          # Hugging Face GGUF (top by downloads)
          try:
              url = "https://huggingface.co/api/models?filter=gguf&sort=downloads&direction=-1&limit=60&expand[]=gguf"
              with urllib.request.urlopen(url) as r:
                  data = json.load(r)
              seen = {m["n"] for m in models}
              for m in data:
                  gguf = m.get("gguf") or {}
                  total = gguf.get("total") or gguf.get("totalFileSize") or 0
                  vram = round(total/1e9*1.05, 2)
                  if vram > 0.5 and m["id"] not in seen:
                      models.append({"n": "hf.co/" + m["id"], "minVram": vram, "speed": 3})
                      seen.add(m["id"])
          except Exception as e:
              print("hf err", e)
          with open("models.json", "w") as f:
              json.dump(models, f, indent=2)
          print("total models:", len(models))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add models.json
          git diff --cached --quiet || git commit -m "update models"
          git push
